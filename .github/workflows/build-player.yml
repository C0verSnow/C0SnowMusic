name: Build and test native iOS player
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main, 'feature/issue-7-*']
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: ios-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  music-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read pinned TG-S3 revision
        id: tg-s3
        run: |
          node -p "'revision=' + require('./storage/tg-s3/upstream.json').revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: gps949/tg-s3
          ref: ${{ steps.tg-s3.outputs.revision }}
          path: build/tg-s3-source
          persist-credentials: false
      - name: Bundle the real upstream TG-S3 Worker (remote CI only)
        working-directory: storage/tg-s3
        run: |
          npm ci
          npx --no-install wrangler deploy "$GITHUB_WORKSPACE/build/tg-s3-source/src/index.ts" \
            --config "$GITHUB_WORKSPACE/storage/tg-s3/wrangler.toml" --dry-run --outdir "$GITHUB_WORKSPACE/build/tg-s3-package"
          mv ../../build/tg-s3-package/index.js ../../build/tg-s3-package/worker.mjs
          cp ../../build/tg-s3-source/src/storage/schema.sql ../../build/tg-s3-package/schema.sql
          cp upstream.json ../../build/tg-s3-package/upstream.json
          cp ../../build/tg-s3-source/README.md ../../build/tg-s3-package/UPSTREAM_README.md
          cp package.json package-lock.json ../../build/tg-s3-package/
          npx --no-install wrangler deploy "$GITHUB_WORKSPACE/worker/index.js" \
            --config "$GITHUB_WORKSPACE/worker/wrangler.toml" --dry-run --outdir "$GITHUB_WORKSPACE/build/tg-s3-package/gateway"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          package = Path('../../build/tg-s3-package')
          manifest = {str(p.relative_to(package)): hashlib.sha256(p.read_bytes()).hexdigest() for p in package.rglob('*') if p.is_file()}
          (package / 'sha256.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Generate real audio fixtures (remote CI only)
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python3 scripts/make_audio_fixtures.py
      - name: Test Worker HTTP API with real SQLite and audio bytes
        working-directory: worker
        env:
          TG_S3_WORKER_ENTRY: ../build/tg-s3-package/worker.mjs
          TG_S3_SCHEMA: ../build/tg-s3-package/schema.sql
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log
      - name: Verify downloader diagnostic file redaction (remote CI only)
        run: python3 scripts/test_downloader_diagnostics.py
      - name: Verify real yt-dlp session and player cache reuse (remote CI only)
        run: |
          head -n 1 scripts/online-requirements.txt > build/yt-dlp-test-requirements.txt
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r build/yt-dlp-test-requirements.txt
          python3 scripts/test_downloader_latency.py
      - name: Upload API evidence and synthetic audio for deployed verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-api-evidence
          path: |
            worker/test-results.log
            MusicApp/Resources/Fixtures/Fixture.mp3
          if-no-files-found: warn
      - name: Upload verified upstream bundle for no-build deployment
        uses: actions/upload-artifact@v4
        with:
          name: tg-s3-worker
          path: build/tg-s3-package/
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Fetch pinned precompiled on-device downloader runtime
        run: python3 scripts/prepare_online_runtime.py
      - name: Check iOS SDK and select simulator
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          candidates = [(runtime, device) for runtime, values in devices.items() if 'iOS-26' in runtime for device in values if device['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('An iOS 26 simulator runtime is required')
          runtime, device = sorted(candidates, key=lambda item: (item[0], item[1]['name'].startswith('iPhone 17'), item[1]['name']))[-1]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"IOS_SIMULATOR_ID={device['udid']}\n")
          print(runtime, device['name'], device['udid'])
          PY
      - name: Generate real audio fixtures (remote CI only)
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          python3 scripts/make_audio_fixtures.py
      - name: Build simulator application and tests
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild build-for-testing -project C0SnowMusic.xcodeproj -scheme C0SnowMusic \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath DerivedData ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/simulator-build.log
          codesign -d --entitlements :- DerivedData/Build/Products/Debug-iphonesimulator/C0SnowMusic.app
      - name: Build unsigned iPhone Release application
        run: |
          set -o pipefail
          xcodebuild build -project C0SnowMusic.xcodeproj -scheme C0SnowMusic \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/device-build.log
      - name: Verify packaged iPhone app icon
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('DerivedData/Build/Products/Release-iphoneos/C0SnowMusic.app')
          with (app / 'Info.plist').open('rb') as file:
              info = plistlib.load(file)
          primary = info['CFBundleIcons']['CFBundlePrimaryIcon']
          assert primary['CFBundleIconName'] == 'AppIcon', primary
          assert (app / 'Assets.car').is_file()
          print('iPhone Release includes AppIcon and compiled asset catalog')
          PY
      - name: Package unsigned IPA for on-device signing
        run: |
          mkdir -p build/Payload
          ditto DerivedData/Build/Products/Release-iphoneos/C0SnowMusic.app build/Payload/C0SnowMusic.app
          ditto -c -k --keepParent build/Payload build/C0SnowMusic-unsigned.ipa
          rm -rf build/Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: C0SnowMusic-unsigned-iPhone
          path: build/C0SnowMusic-unsigned.ipa
          if-no-files-found: error
      - name: Boot iOS simulator
        timeout-minutes: 8
        run: |
          xcrun simctl boot "$IOS_SIMULATOR_ID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
      - name: Run unit, audio integration, and UI tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building -project C0SnowMusic.xcodeproj -scheme C0SnowMusic \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 120 \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/test.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/Screenshots
          fi
      - name: Upload test evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-evidence
          path: |
            build/*.log
            build/*.xcresult/
            build/Screenshots/
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios, music-api]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: C0SnowMusic-unsigned-iPhone
          path: release
      - name: Publish tested IPA to versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release/notes.md <<'EOF'
          原生 iOS 26 音乐播放器。本版本包含账户页 Music Settings、语言选择、Google/YouTube 网页登录、YouTube 卡片搜索与手机本机 yt-dlp 音频下载。

          - IPA 内含手机本机 Python/yt-dlp/WebKit 运行时，不需要服务器。
          - 音频缓存上限 500 MB，按从新到旧显示；手动下载到资料库的副本不会被缓存清理删除。
          - 本 IPA 未签名，须用自己的 Apple 证书签名后安装。YouTube 网页登录无需 Google Client ID，Cookie 只保存在本机。
          - 仅在对应提交的模拟器测试和 iPhone Release 编译全部通过后发布。真实网站可用性仍受网络、地区和 YouTube 验证影响。
          EOF
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "release/C0SnowMusic-unsigned.ipa" \
            --verify-tag --title "c0versnow music $GITHUB_REF_NAME" \
            --notes-file release/notes.md "${release_flags[@]}"
