name: Validate workflow documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JSON and workflow references (no build)
        run: python scripts/validate_workflows.py
      - name: Check whitespace
        run: git diff-tree --check HEAD
