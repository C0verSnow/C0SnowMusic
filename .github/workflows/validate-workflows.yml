name: Validate project files
on:
  pull_request:
  push:
    branches: [main, 'feature/issue-7-*', 'feature/issue-9-*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check project and application property lists (no build)
        run: plutil -lint MusicApp/Info.plist C0SnowMusic.xcodeproj/project.pbxproj
      - name: Check whitespace
        run: git diff-tree --check HEAD
